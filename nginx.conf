events { worker_connections 1024; }

http {
    upstream carrental_nodes {
        # Definicja klastra aplikacji
        server carrental-node-1:8080 max_fails=1 fail_timeout=5s;
        server carrental-node-2:8080 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://carrental_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Parametry szybkiego przełączania w razie awarii (Failover timeouts)
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
}
